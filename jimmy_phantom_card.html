<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>吉米 · WIND MIRAGE — SSR 全息殘影卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  @property --holo-ang { syntax:'<angle>'; inherits:true; initial-value:110deg; }

  :root{
    --emerald:#10b981;
    --cyan:#06b6d4;
    --abyss:#09121a;
    --frame:6px;
    --card-w: clamp(272px, min(86vw, 58vh), 372px);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:radial-gradient(130% 120% at 50% -10%, #10222e 0%, #0a1520 38%, #05090e 72%, #03060a 100%);
    color:#e8f6f1;
    font-family:'Noto Sans TC', system-ui, -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif;
    display:grid; place-items:center; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  body::before{
    content:""; position:fixed; inset:-20%;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(16,185,129,.5), transparent 60%),
      radial-gradient(2px 2px at 78% 22%, rgba(6,182,212,.45), transparent 60%),
      radial-gradient(1.5px 1.5px at 62% 68%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(1.5px 1.5px at 33% 82%, rgba(6,182,212,.35), transparent 60%);
    filter:blur(.3px);
    animation:floatDust 22s ease-in-out infinite alternate; pointer-events:none;
  }
  @keyframes floatDust{ to{ transform:translate3d(2%,-3%,0) rotate(3deg); } }

  .stage{
    perspective:1300px;
    perspective-origin:50% 42%;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:60px 22px 26px;               /* 上方留白給探出卡面的貓頭 */
  }

  /* ==================== 卡牌容器（3D 傾斜；本身不加 filter，才留得住 preserve-3d） ==================== */
  .card{
    position:relative;
    width:var(--card-w);
    aspect-ratio:100 / 140;
    border-radius:20px;
    transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition: transform .1s ease-out;   /* 消弭游標抖動 */
    transform-style: preserve-3d;
    will-change: transform;
  }

  /* ---------- 動態金屬流光外框（卡片本體的投影掛在這層，不掛在 .card） ---------- */
  .card__frame{
    position:absolute; inset:0;
    border-radius:inherit;
    padding:var(--frame);
    transform: translateZ(0);
    background:linear-gradient(115deg,
      #241a05 0%, #8a6a1c 9%, #d8b352 19%, #fff6d8 27%, #b98d2e 35%,
      #5c4610 47%, #9a7a24 58%, #f4e2a0 70%, #7c5f18 84%, #241a05 100%);
    background-size:280% 280%;
    animation: sheen 7s linear infinite;
    filter:
      brightness(var(--sheen,1)) saturate(1.06)
      drop-shadow(0 34px 48px rgba(0,0,0,.62))
      drop-shadow(0 9px 18px rgba(0,0,0,.55));
    box-shadow:
      inset 0 0 0 1px rgba(255,244,210,.42),
      inset 0 0 16px rgba(0,0,0,.55),
      0 0 22px rgba(212,175,55,.14);
  }
  @keyframes sheen{ from{ background-position:0% 50%; } to{ background-position:280% 50%; } }

  .card__inner{
    position:relative; height:100%;
    border-radius:14px; overflow:hidden;
    isolation:isolate;
    background:radial-gradient(120% 78% at 50% -6%, #142833 0%, var(--abyss) 52%, #05090d 100%);
    box-shadow: inset 0 0 0 1px rgba(6,182,212,.20), inset 0 0 46px rgba(0,0,0,.72);
  }

  /* ==================== 場景窗（背景環境 + 兩層殘影，剪裁在窗內、屬於較深的景深） ==================== */
  .scene{
    position:absolute; left:0; right:0; top:0;
    height:60%;
    overflow:hidden;
    z-index:1;
  }
  .scene img, .scene .ghost{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    transition: transform .16s ease-out;
    will-change: transform;
    backface-visibility:hidden;
  }
  /* 最深：把「當時的場景」大幅模糊、壓暗、去彩，變成貓漂浮於前方的環境霧 */
  .scene__bg{
    z-index:1;
    filter: blur(8px) brightness(.42) saturate(.62) contrast(1.06);
    transform: scale(1.28);
    object-position:60% 34%;
  }
  /* 中景：青藍「警戒」殘影 */
  .ghost--warn{
    z-index:2;
    opacity:.42;
    mix-blend-mode:screen;
    filter:sepia(1) hue-rotate(188deg) saturate(3.2) brightness(.9) contrast(1.12)
           drop-shadow(0 0 10px rgba(0,220,255,.7));
    transform: translate(11%, -18%) scale(1.16);
    object-position:36% 42%;
  }
  /* 中景後：翠綠「沉睡」殘影（位移最大、飄最遠） */
  .ghost--past{
    z-index:3;
    opacity:.4;
    mix-blend-mode:screen;
    filter:sepia(1) hue-rotate(96deg) saturate(4) brightness(.9) contrast(1.1) blur(.6px)
           drop-shadow(0 0 11px rgba(0,255,150,.7));
    transform: translate(-28%, 16%) scale(1.26);
    object-position:center 58%;
  }
  .scene__mist{
    position:absolute; inset:0; z-index:4; pointer-events:none;
    box-shadow:
      inset 0 -46px 40px rgba(9,18,26,.95),
      inset 0 24px 26px rgba(0,0,0,.42),
      inset 0 0 0 1px rgba(0,0,0,.3);
    background:linear-gradient(180deg,
      rgba(9,18,26,.30) 0%, rgba(9,18,26,0) 18%,
      rgba(9,18,26,0) 52%, rgba(9,18,26,.72) 82%, var(--abyss) 100%);
  }

  /* ==================== 全息膜（卡面上的光學層，在主體之下） ==================== */
  .holo{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    mix-blend-mode: color-dodge;
    opacity:.32;
    -webkit-mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.22) 64%, rgba(0,0,0,.14) 100%);
    mask-image: linear-gradient(180deg, #000 0 52%, rgba(0,0,0,.22) 64%, rgba(0,0,0,.14) 100%);
  }
  .holo__spectrum{
    position:absolute; inset:0;
    background:
      radial-gradient(38% 30% at var(--gx,50%) var(--gy,50%), rgba(255,255,255,.13), rgba(255,255,255,0) 70%),
      linear-gradient(var(--holo-ang,110deg),
        rgba(255,0,140,.42) 0%, rgba(0,224,255,.42) 20%, rgba(120,70,255,.42) 42%,
        rgba(255,214,0,.42) 64%, rgba(0,255,168,.42) 82%, rgba(255,0,140,.42) 100%);
    background-size:200% 200%, 320% 320%;
    background-position:0 0, var(--sweep,50%) 50%;
    filter:saturate(1.35) contrast(1.04);
  }
  .holo__dust{
    position:absolute; inset:-25%;
    background-image:
      radial-gradient(rgba(255,255,255,.95) .6px, transparent 1.4px),
      radial-gradient(rgba(150,255,238,.85) .7px, transparent 1.6px),
      radial-gradient(rgba(255,232,170,.8) .6px, transparent 1.4px);
    background-size:17px 17px, 26px 26px, 39px 41px;
    background-position:0 0, 8px 11px, 19px 4px;
    transform: translate(var(--dx,0px), var(--dy,0px));
    animation: dustDrift 12s linear infinite;
    opacity:.5;
  }
  @keyframes dustDrift{
    from{ background-position:0 0, 8px 11px, 19px 4px; }
    to  { background-position:34px -46px, -30px 37px, 52px 44px; }
  }

  /* ==================== 頂部標記 ==================== */
  /* 稀有度/屬性標記：拉成 .card 直屬層、translateZ 比主體(60)再高一點，
     讓貓可以壓在外框/面板上，但這兩顆關鍵資訊永遠讀得到 */
  .topbar{
    position:absolute; top:15px; left:15px; right:15px; z-index:21;
    transform: translateZ(66px);
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  .chip{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:700;
    font-size:11px; letter-spacing:.16em; padding:5px 10px 4px;
    border-radius:8px; border:1px solid rgba(255,255,255,.24);
    text-shadow:0 1px 2px #000;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .chip--wind{
    color:#dcfff6;
    background:linear-gradient(120deg, rgba(6,182,212,.6), rgba(16,185,129,.42));
    box-shadow:0 0 14px rgba(6,182,212,.42), inset 0 1px 0 rgba(255,255,255,.32);
  }
  .chip--ssr{
    color:#2a1a00; letter-spacing:.26em;
    background:linear-gradient(120deg,#ffe9a8,#d4af37 55%,#a97d1e);
    border-color:rgba(255,246,214,.65);
    box-shadow:0 0 16px rgba(212,175,55,.55), inset 0 1px 0 rgba(255,255,255,.6);
  }

  /* ==================== 技能資訊區（毛玻璃，卡面上） ==================== */
  .panel{
    position:absolute; left:0; right:0; bottom:0;
    height:46%; z-index:2;
    padding:14px 17px 16px;
    display:flex; flex-direction:column; gap:8px;
    background: rgba(15,23,42,.85);
    -webkit-backdrop-filter: blur(6px) saturate(1.15);
    backdrop-filter: blur(6px) saturate(1.15);
    border-top:1px solid rgba(125,232,220,.30);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 -18px 40px rgba(0,0,0,.42);
  }
  .eyebrow{
    font-family:'Cinzel',serif; font-weight:600; letter-spacing:.34em;
    font-size:10.5px; color:var(--cyan);
    text-shadow:0 0 10px rgba(6,182,212,.55), 0 1px 2px #000;
  }
  .name{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:900;
    font-size:30px; line-height:1; color:#f4fffb; letter-spacing:.05em;
    text-shadow:0 0 18px rgba(16,185,129,.42), 0 2px 5px #000;
  }
  .name::after{
    content:""; display:block; margin-top:7px; height:1px; width:100%;
    background:linear-gradient(90deg, rgba(16,185,129,.7), rgba(6,182,212,.3) 45%, transparent);
  }
  .skill{ position:relative; padding-left:12px; margin-top:1px; }
  .skill::before{
    content:""; position:absolute; left:0; top:1px; bottom:3px;
    width:3px; border-radius:2px;
    background:linear-gradient(180deg, var(--emerald), rgba(16,185,129,.12));
    box-shadow:0 0 10px rgba(16,185,129,.75);
  }
  .skill__name{
    font-family:'Cinzel','Noto Sans TC',serif; font-weight:700; font-size:15px;
    color:var(--emerald); text-shadow:0 0 12px rgba(16,185,129,.5), 0 1px 2px #000;
  }
  .skill__name span{
    font-family:'Noto Sans TC',sans-serif; font-weight:500; font-size:10.5px;
    color:#8fb9c6; letter-spacing:.12em; margin-left:4px;
  }
  .skill__desc{
    margin-top:4px; font-size:11.5px; line-height:1.6; color:#dcefe9;
    text-shadow:0 1px 3px #000, 0 0 7px rgba(0,0,0,.7);
  }
  .skill__desc b{ color:#fff; font-weight:700; text-shadow:0 0 8px rgba(16,185,129,.65), 0 1px 2px #000; }

  /* ==================== 主體：去背的貓，浮在卡面之上、層級最高、有落地陰影 ==================== */
  .subject{
    position:absolute;
    left:50%; bottom:50%;
    width:75%;
    z-index:20;                          /* 高於外框(z auto)、面板、全息、標記 */
    pointer-events:none;
    /* translateZ 讓它在 preserve-3d 空間裡真的往鏡頭方向浮出來；
       drop-shadow 是「與卡片分離」最關鍵的線索 —— 貓把影子投在卡面上 */
    transform:
      translate(-50%, 0)
      translate3d(var(--sx,0px), var(--sy,0px), 60px)
      rotateX(var(--srx,0deg)) rotateY(var(--sry,0deg))
      scale(var(--sscale,1));
    transition: transform .1s ease-out;
    filter:
      drop-shadow(0 32px 22px rgba(0,0,0,.66))
      drop-shadow(0 12px 12px rgba(0,0,0,.48))
      drop-shadow(0 0 18px rgba(6,182,212,.30))
      contrast(1.08) saturate(1.09) brightness(1.02);
  }
  .subject img{ display:block; width:100%; height:auto; }

  .hint{ font-size:11px; letter-spacing:.18em; color:rgba(200,232,224,.5); text-shadow:0 1px 3px #000; }

  @media (prefers-reduced-motion: reduce){
    .card__frame, .holo__dust, body::before{ animation:none !important; }
    .card, .subject{ transition:none; }
  }
</style>
</head>

<script>
(function(){
  "use strict";
  var card    = document.getElementById('card');
  var subject = document.getElementById('subject');
  var pastG   = document.querySelector('.ghost--past');
  var warnG   = document.querySelector('.ghost--warn');
  var bg      = document.querySelector('.scene__bg');
  var holo    = document.getElementById('holo');
  var spectrum= holo.querySelector('.holo__spectrum');
  var dust    = holo.querySelector('.holo__dust');

  var MAX_DEG = 25;
  var reduce  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cur = { rx:0, ry:0, ox:0, oy:0, gx:50, gy:50, mag:0 };
  var tgt = { rx:0, ry:0, ox:0, oy:0, gx:50, gy:50, mag:0 };
  var pointerActive = false;
  var start = performance.now();

  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  function aim(clientX, clientY){
    var r = card.getBoundingClientRect();
    var nx = (clientX - r.left) / r.width;
    var ny = (clientY - r.top ) / r.height;
    var ox = clamp(nx*2-1, -1, 1);
    var oy = clamp(ny*2-1, -1, 1);
    tgt.ry = clamp(ox*MAX_DEG, -MAX_DEG, MAX_DEG);
    tgt.rx = clamp(-oy*MAX_DEG, -MAX_DEG, MAX_DEG);
    tgt.ox = ox; tgt.oy = oy;
    tgt.gx = clamp(nx*100, 0, 100);
    tgt.gy = clamp(ny*100, 0, 100);
    tgt.mag = Math.min(1, Math.hypot(ox, oy));
    pointerActive = true;
  }
  function release(){
    tgt.rx=tgt.ry=tgt.ox=tgt.oy=0; tgt.gx=tgt.gy=50; tgt.mag=0;
    pointerActive = false;
  }

  window.addEventListener('pointermove', function(e){ aim(e.clientX, e.clientY); }, { passive:true });
  card.addEventListener('pointerleave', release);
  window.addEventListener('blur', release);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) release(); });

  window.addEventListener('deviceorientation', function(e){
    if (e.gamma==null || e.beta==null) return;
    var ox = clamp(e.gamma/28, -1, 1);
    var oy = clamp((e.beta-42)/28, -1, 1);
    tgt.ry = clamp(ox*MAX_DEG, -MAX_DEG, MAX_DEG);
    tgt.rx = clamp(-oy*MAX_DEG, -MAX_DEG, MAX_DEG);
    tgt.ox = ox; tgt.oy = oy;
    tgt.gx = 50+ox*50; tgt.gy = 50+oy*50;
    tgt.mag = Math.min(1, Math.hypot(ox, oy));
    pointerActive = true;
  }, true);

  function frame(t){
    if (!pointerActive && !reduce){
      var s = (t-start)/1000;
      tgt.ry = Math.sin(s*0.7)*8;   tgt.rx = Math.cos(s*0.52)*5.5;
      tgt.ox = Math.sin(s*0.7)*0.3; tgt.oy = Math.cos(s*0.52)*0.22;
      tgt.gx = 50+Math.sin(s*0.7)*26; tgt.gy = 50+Math.cos(s*0.52)*20;
      tgt.mag = 0.22;
    }
    var k = reduce ? 1 : 0.14;
    for (var key in cur){ cur[key] += (tgt[key]-cur[key])*k; }

    var bx = -cur.ox, by = -cur.oy;

    // 卡片本體傾斜
    card.style.setProperty('--rx', cur.rx.toFixed(2)+'deg');
    card.style.setProperty('--ry', cur.ry.toFixed(2)+'deg');
    card.style.setProperty('--sheen', (1 + cur.mag*0.55).toFixed(3));

    // 主體：往指標「同向」小幅追、比卡片少轉一點（產生「自成一個平面」的分離感），
    //       落地陰影會被 drop-shadow 拉開，看起來是浮在卡面上。
    subject.style.setProperty('--sx', (cur.ox * 9).toFixed(1)+'px');
    subject.style.setProperty('--sy', (cur.oy * 7 - cur.mag*3).toFixed(1)+'px');
    subject.style.setProperty('--srx', (-cur.rx*0.5).toFixed(2)+'deg');
    subject.style.setProperty('--sry', (-cur.ry*0.5).toFixed(2)+'deg');
    subject.style.setProperty('--sscale', (1 + cur.mag*0.025).toFixed(3));

    // 景深疊層：離鏡頭越遠位移越大、方向相反（背景霧最少、殘影最多）
    bg.style.transform    = 'translate(' + (bx*8 ).toFixed(1) + 'px,' + (by*7 ).toFixed(1) + 'px) scale(1.28)';
    warnG.style.transform = 'translate(calc(11% + '  + (bx*38).toFixed(1) + 'px), calc(-18% + ' + (by*33).toFixed(1) + 'px)) scale(1.16)';
    pastG.style.transform = 'translate(calc(-28% + ' + (bx*64).toFixed(1) + 'px), calc(16% + '  + (by*56).toFixed(1) + 'px)) scale(1.26)';

    // 全息
    var ang = Math.atan2(cur.oy, cur.ox)*180/Math.PI + 110;
    spectrum.style.setProperty('--holo-ang', ang.toFixed(1)+'deg');
    spectrum.style.setProperty('--gx', cur.gx.toFixed(1)+'%');
    spectrum.style.setProperty('--gy', cur.gy.toFixed(1)+'%');
    spectrum.style.setProperty('--sweep', (50 + cur.ox*55).toFixed(1)+'%');
    holo.style.opacity = (0.14 + cur.mag*0.30).toFixed(3);
    dust.style.setProperty('--dx', (cur.ox*-16).toFixed(1)+'px');
    dust.style.setProperty('--dy', (cur.oy*-16).toFixed(1)+'px');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function'){
    var ask = function(){ DeviceOrientationEvent.requestPermission().catch(function(){}); window.removeEventListener('click', ask); };
    window.addEventListener('click', ask);
  }
})();
</script>
